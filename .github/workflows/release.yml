name: Release
run-name: Release - ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"

jobs:
  release-candidate:
    name: Release Candidate Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      version: ${{ steps.tag.outputs.release_version }}
      tag: ${{ steps.tag.outputs.release_git_tag }}
      existing_tag: ${{ steps.tag.outputs.existing_release_git_tag }}
    steps:
      - name: Resolve release commit
        id: resolve
        shell: bash
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
        run: |
          SHA="$GH_SHA"
          BRANCH="${GH_REF#refs/heads/}"
          if [[ "$BRANCH" != "main" ]]; then
            echo "::error::Release workflow must run from main. Resolved branch: $BRANCH"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA image exists in GHCR
        shell: bash
        env:
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_TAG="ghcr.io/${IMAGE_NAME}:sha-${SHA_SHORT}"
          if ! docker buildx imagetools inspect "${SOURCE_TAG}" > /dev/null 2>&1; then
            echo "::error::Image sha-${SHA_SHORT} not found in GHCR. Wait for the Container Image workflow to complete for this commit before releasing."
            exit 1
          fi
          echo "Image sha-${SHA_SHORT} verified in GHCR."

      - name: Resolve next personal release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          EXISTING_TAG="$(gh api "repos/${GH_REPO}/releases" --paginate --jq ".[] | select(.target_commitish == \"${TARGET_SHA}\") | .tag_name" \
            | grep -E '^v2\.0\.[0-9]+-personal$' \
            | head -n1 || true)"
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "Release ${EXISTING_TAG} already exists for ${TARGET_SHA}."
            echo "existing_release_git_tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            echo "release_version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "release_git_tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_PATCH="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[].tag_name' \
            | sed -nE 's/^v2\.0\.([0-9]+)-personal$/\1/p' \
            | sort -n \
            | tail -n1)"
          NEXT_PATCH="$(( ${LATEST_PATCH:-0} + 1 ))"
          VERSION="2.0.${NEXT_PATCH}-personal"
          TAG="v${VERSION}"
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_git_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Release candidate summary
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.release_version }}
          TAG: ${{ steps.tag.outputs.release_git_tag }}
          SHA_SHORT: ${{ steps.resolve.outputs.sha_short }}
          EXISTING_TAG: ${{ steps.tag.outputs.existing_release_git_tag }}
        run: |
          echo "## Release Candidate Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source SHA tag:** \`sha-${SHA_SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${EXISTING_TAG}" ]]; then
            echo "- **Existing release:** \`${EXISTING_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Next release:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** checks passed; no release was published automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish Release
    needs: [release-candidate]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    outputs:
      published: ${{ steps.publish.outputs.new_release_published }}
      version: ${{ needs.release-candidate.outputs.version }}
      tag: ${{ needs.release-candidate.outputs.tag }}
      sha: ${{ needs.release-candidate.outputs.sha }}
      sha_short: ${{ needs.release-candidate.outputs.sha_short }}
    steps:
      - name: Create release tag
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.release-candidate.outputs.sha }}
          TAG: ${{ needs.release-candidate.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$TAG" --repo "$GH_REPO" --target "$TARGET_SHA" --title "$TAG" --generate-notes
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"

      - name: Release summary
        if: steps.publish.outputs.new_release_published == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.release-candidate.outputs.version }}
          TAG: ${{ needs.release-candidate.outputs.tag }}
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  docker-promote:
    name: Build Release Docker Image
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.release.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: APP_VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=container-image-yml

      - name: Enrich release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          gh release view "${TAG}" --repo "${GH_REPO}" --json body --jq '.body' > "${BODY_FILE}"

          if grep -q "<!-- release-metadata -->" "${BODY_FILE}"; then
            echo "Release metadata already present; skipping."
            exit 0
          fi

          PREV_TAG=$(gh release list \
            --repo "${GH_REPO}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | awk -v current="${TAG}" '$0 != current {print; exit}')

          {
            echo ""
            echo "<!-- release-metadata -->"
            echo ""
            if [[ -n "${PREV_TAG}" ]]; then
              echo "[Full diff](https://github.com/${GH_REPO}/compare/${PREV_TAG}...${TAG})"
              echo ""
            fi
          } >> "${BODY_FILE}"

          gh release edit "${TAG}" --repo "${GH_REPO}" --notes-file "${BODY_FILE}"

      - name: Docker publish summary
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_SHORT: ${{ needs.release.outputs.sha_short }}
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build version:** \`v${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source SHA tag:** \`sha-${SHA_SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:** \`${VERSION}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
